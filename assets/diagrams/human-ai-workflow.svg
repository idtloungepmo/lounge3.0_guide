<text x="1115" y="707" fill="#b4bdd2" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central">결과 갱신</text>
<rect x="301.0" y="854" width="124" height="32" rx="7" fill="#0b0d14"/>
<text x="363" y="870" fill="#b4bdd2" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central">수정 없음</text>
<rect x="100" y="110" width="360" height="80" rx="12" fill="#131620" stroke="#a875ff" stroke-width="2"/>
<text x="280.0" y="139" fill="#f7f8fc" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="central">목표·범위 전달</text>
<text x="280.0" y="168" fill="#b4bdd2" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central">대상 · 원하는 결과 · 허용 범위</text>
<rect x="700" y="110" width="360" height="80" rx="12" fill="#131620" stroke="#45dcff" stroke-width="2"/>
<text x="880.0" y="139" fill="#f7f8fc" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="central">필요한 자료 확인</text>
<text x="880.0" y="168" fill="#b4bdd2" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central">지침 · 원본 · 스킬 선택</text>
<polygon points="880,235 1010,300 880,365 750,300" fill="#12151e" stroke="#45dcff" stroke-width="2"/>
<text x="880" y="284" fill="#f7f8fc" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central">사람의 결정이</text>
<text x="880" y="316" fill="#f7f8fc" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central">필요한가?</text>
<rect x="100" y="260" width="360" height="80" rx="12" fill="#131620" stroke="#a875ff" stroke-width="2"/>
<text x="280.0" y="289" fill="#f7f8fc" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="central">기준 결정</text>
<text x="280.0" y="318" fill="#b4bdd2" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central">기획 · 정책 · 허용 범위</text>
<rect x="700" y="440" width="360" height="90" rx="12" fill="#131620" stroke="#45dcff" stroke-width="2"/>
<text x="880.0" y="469" fill="#f7f8fc" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="central">작업·검증</text>
<text x="880.0" y="498" fill="#b4bdd2" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central">지정한 범위에서 작업하고 검증</text>
<rect x="700" y="600" width="360" height="80" rx="12" fill="#131620" stroke="#45dcff" stroke-width="2"/>
<text x="880.0" y="629" fill="#f7f8fc" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="central">변경·검증 결과 정리</text>
<text x="880.0" y="658" fill="#b4bdd2" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central">근거 · 미확인 사항</text>
<rect x="100" y="600" width="360" height="80" rx="12" fill="#131620" stroke="#a875ff" stroke-width="2"/>
<text x="280.0" y="629" fill="#f7f8fc" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="central">결과·근거 확인</text>
<text x="280.0" y="658" fill="#b4bdd2" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central">실제 변경과 검증 결과 확인</text>
<polygon points="280,715 410,780 280,845 150,780" fill="#12151e" stroke="#a875ff" stroke-width="2"/>
<text x="280" y="764" fill="#f7f8fc" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central">수정이</text>
<text x="280" y="796" fill="#f7f8fc" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central">필요한가?</text>
<rect x="700" y="740" width="360" height="80" rx="12" fill="#131620" stroke="#45dcff" stroke-width="2"/>
<text x="880.0" y="769" fill="#f7f8fc" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="central">수정·재검증</text>
<text x="880.0" y="798" fill="#b4bdd2" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central">지적한 문제를 수정하고 다시 검증</text>
<rect x="100" y="900" width="360" height="80" rx="12" fill="#131620" stroke="#a875ff" stroke-width="2"/>
<text x="280.0" y="929" fill="#f7f8fc" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="21" font-weight="700" text-anchor="middle" dominant-baseline="central">다음 작업 판단</text>
<text x="280.0" y="958" fill="#b4bdd2" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central">남은 사항과 다음 작업 확인</text>
</svg>
