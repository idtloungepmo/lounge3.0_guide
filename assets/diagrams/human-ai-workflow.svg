<polyline points="880,190 880,235" fill="none" stroke="#91a3bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
<polyline points="750,300 460,300" fill="none" stroke="#91a3bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
<polyline points="280,340 280,485 700,485" fill="none" stroke="#91a3bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
<polyline points="880,365 880,440" fill="none" stroke="#91a3bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
