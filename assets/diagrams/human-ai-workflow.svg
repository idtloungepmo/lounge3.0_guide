<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">사람과 AI의 협업 흐름</title>
<desc id="flow-desc">사람이 목표와 범위를 전달하면 AI가 자료를 확인합니다. 사람의 결정이 필요하면 기준을 확인한 뒤 작업하고 검증합니다. AI가 결과를 정리하면 사람이 근거를 확인합니다. 수정이 필요하면 AI가 수정·재검증한 결과를 다시 정리해 사람에게 전달합니다. 수정할 사항이 없으면 사람이 다음 작업을 판단합니다.</desc>
<defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#91a3bb"/></marker></defs>
<rect x="0" y="0" width="1200" height="1010" rx="0" fill="#0b0d14"/>
<rect x="40" y="78" width="500" height="910" rx="20" fill="#13101e"/>
<rect x="660" y="78" width="500" height="910" rx="20" fill="#0c171e"/>
<text x="280" y="44" fill="#a875ff" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="central">사람</text>
<text x="880" y="44" fill="#45dcff" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="central">AI</text>
