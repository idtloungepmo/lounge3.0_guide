<polyline points="280,845 280,900" fill="none" stroke="#91a3bb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
<rect x="518.0" y="112" width="124" height="32" rx="7" fill="#0b0d14"/>
<text x="580" y="128" fill="#b4bdd2" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central">작업 요청</text>
<rect x="568.0" y="262" width="64" height="32" rx="7" fill="#0b0d14"/>
<text x="600" y="278" fill="#b4bdd2" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central">필요</text>
<rect x="378.0" y="447" width="224" height="32" rx="7" fill="#0b0d14"/>
<text x="490" y="463" fill="#b4bdd2" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central">기준 확인 후 작업</text>
<rect x="900.0" y="387" width="124" height="32" rx="7" fill="#0b0d14"/>
<text x="962" y="403" fill="#b4bdd2" font-family="Malgun Gothic, Pretendard, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central">바로 진행</text>
